# mono — hierarquia por peso e por símbolo.
# Duas linhas: contexto em cima, cursor embaixo, sempre na mesma coluna.
#
# A cor entra APENAS nos três ícones de ferramenta (git, node, python), na cor
# de marca de cada uma. O resto segue sem cor. Isso é deliberado e é a única
# exceção: o tema do kitty tem as 16 cores ANSI achatadas em cinza, então esses
# glifos são a única cor da tela e funcionam como acento, não como decoração.
#
# Para voltar ao mono puro, troque as três cores de marca abaixo por cinza:
#   (#f05033) -> (#8a8a8a)      git
#   (#8cc84b) -> (#6e6e6e)      node
#   (#4b8bbe) -> (#6e6e6e)      python

add_newline = true
format = """
$time$directory$git_branch$git_status$nodejs$python$cmd_duration
$character"""

[character]
# Traço horizontal. A barra vertical foi testada antes e colidia com o
# cursor do kitty — dois retângulos verticais iguais lado a lado, sem
# dizer qual é qual. O traço é a mesma marca sólida do tema, girada 90°,
# e por isso nunca se confunde com o cursor.
#
# Estado é luminância, não forma: o erro é o MESMO traço, mais escuro.
success_symbol = "[—](bold white)"
error_symbol   = "[—](bold #5a5a5a)"
vimcmd_symbol  = "[—](bold #8a8a8a)"

[directory]
style              = "bold white"
truncation_length  = 3
truncate_to_repo   = true
format             = "[$path]($style)[$read_only]($read_only_style) "
read_only          = " ro"
read_only_style    = "#3d3d3d"

[git_branch]
# U+E725 nf-dev-git_branch. Colorido só o glifo: o nome do branch continua
# no cinza de antes, para o ícone marcar a linha sem roubar a leitura.
style  = "#8a8a8a"
symbol = " "
format = "[$symbol](#f05033)[$branch]($style) "

[git_status]
style     = "#3d3d3d"
format    = "[$all_status$ahead_behind]($style)"
conflicted = "!"
ahead      = "↑"
behind     = "↓"
diverged   = "↕"
untracked  = "?"
stashed    = "$"
modified   = "*"
staged     = "+"
renamed    = "»"
deleted    = "x"

[nodejs]
# U+E718 nf-dev-nodejs_small — o hexágono do Node, no verde da marca.
style  = "#3d3d3d"
symbol = " "
format = "[$symbol](#8cc84b)[$version]($style) "

[python]
# U+E73C nf-dev-python, no azul da marca.
style  = "#3d3d3d"
symbol = " "
format = "[$symbol](#4b8bbe)[$version]($style) "

# Horário à esquerda do diretório, em cinza baixo: prefixa a linha como
# um carimbo de log, sem competir com o caminho.
[time]
disabled    = false
style       = "#3d3d3d"
time_format = "%H:%M"
format      = "[$time]($style) "

[cmd_duration]
style        = "#3d3d3d"
min_time     = 2000
format       = "[$duration]($style)"

# desligados: sem sopa de ícone e sem informação redundante
[package]
disabled = true

[hostname]
disabled = true

[username]
disabled = true
