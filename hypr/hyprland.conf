###############################################################################
#  hyprland.conf — mono
#
#  Escrito do zero. A ÚNICA coisa importada do repositório arch-settings é o
#  bloco KEYBINDINGS lá embaixo, literal, com 3 alvos trocados (Walker no lugar
#  do wofi, scripts movidos para hypr/scripts, ws-smart removido a pedido).
#
#  Nada mais veio de lá: monitor, autostart, input, window rules e layout são
#  todos definidos aqui.
###############################################################################


################
### MONITORS ###
################

# Auto-detecta o monitor conectado. Se quiser fixar a sua saída e taxa:
#   monitor = DP-1,2560x1440@144,0x0,1
monitor = ,preferred,auto,1


###################
### MY PROGRAMS ###
###################

$terminal    = kitty
$fileManager = nautilus
$menu        = walker
$browser     = firefox


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Um único platform theme para Qt. O .profile exporta o MESMO valor.
env = QT_QPA_PLATFORMTHEME,qt6ct

# Sem barra de título do compositor: apps Qt não devem desenhar a própria.
# Em tiling, título é espaço morto numa janela que já está posicionada.
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# Wayland nativo em vez de XWayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = GDK_BACKEND,wayland,x11


#############
### TEMA  ###
#############

exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec = gsettings set org.gnome.desktop.interface gtk-theme    "adw-gtk3-dark"
exec = gsettings set org.gnome.desktop.interface icon-theme   "Papirus-Dark"
exec = gsettings set org.gnome.desktop.interface font-name           "SF Pro Text 11"
exec = gsettings set org.gnome.desktop.interface monospace-font-name "JetBrainsMono Nerd Font 11"

# Nautilus em lista, não em grade: na grade os ícones de mimetype do Papirus
# viram clip art de 48px e os nomes quebram no meio da palavra. Em lista eles
# caem para 16px e leem como glifo discreto.
exec = gsettings set org.gnome.nautilus.preferences default-folder-viewer "list-view"
exec = gsettings set org.gnome.nautilus.list-view   default-zoom-level    "small"
exec = gsettings set org.gnome.nautilus.preferences default-sort-order    "type"


#################
### AUTOSTART ###
#################
# Só o que ESTE setup precisa para funcionar. Nenhum app pessoal sobe
# sozinho — se quiser algum no boot, adicione você.

exec-once = hyprpaper
exec-once = ags run

# elephant é o backend de providers do Walker 2.x. Sem ele o launcher abre
# vazio. Não existe unit do systemd, então sobe aqui.
exec-once = elephant
exec-once = walker --gapplication-service


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in  = 3
    gaps_out = 6

    border_size = 1

    col.active_border   = rgb(ffffff)
    col.inactive_border = rgb(262626)

    resize_on_border = false
    allow_tearing    = false

    layout = dwindle
}

decoration {
    # 6px: lê como decisão, longe do blob de 10 do default.
    rounding = 6

    # > 2 aproxima o canto de um squircle em vez de um arco de círculo.
    # Quase imperceptível de propósito.
    rounding_power = 2.5

    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    # Blur leve. A janela em si fica OPACA (opacity 1.0) de propósito: baixar
    # a opacidade da janela inteira lava o texto junto. O blur aparece através
    # do que é translúcido por conta própria — o fundo do kitty
    # (background_opacity), a barra do AGS e o Walker.
    blur {
        enabled = true
        size    = 4
        passes  = 2

        noise      = 0.008
        contrast   = 1.0
        brightness = 0.9

        # vibrancy = 0: ela reintroduz saturação de cor, que é exatamente
        # o que este tema não quer.
        vibrancy            = 0.0
        vibrancy_darkness   = 0.0

        popups             = true
        popups_ignorealpha = 0.2
    }
}

animations {
    enabled = true

    # Uma curva só. easeOutExpo: sai rápido, chega devagar — a janela
    # assenta no lugar em vez de saltar.
    bezier = out,   0.16, 1,    0.30, 1
    bezier = inout, 0.65, 0,    0.35, 1

    # popin 96%, não os 87% do default: 87% é um salto que se VÊ,
    # 96% é um assentamento que se SENTE.
    animation = windows,    1, 4, out, popin 96%
    animation = windowsIn,  1, 4, out, popin 96%
    animation = windowsOut, 1, 3, out, popin 96%

    animation = fade,    1, 3, out
    animation = fadeIn,  1, 3, out
    animation = fadeOut, 1, 2, out

    # A borda anima MAIS devagar que a janela de propósito: sem cor,
    # a borda branca é o único sinal de foco.
    animation = border, 1, 6, out

    animation = layers,    1, 3, out, fade
    animation = layersIn,  1, 3, out, fade
    animation = layersOut, 1, 2, out, fade

    animation = workspaces,       1, 4, inout, slide
    animation = specialWorkspace, 1, 4, inout, slidevert
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0

    # Cor por trás do wallpaper, enquanto o hyprpaper não carregou e nas
    # bordas se a imagem não cobrir. Mesma cor de fundo do logo do Arch.
    background_color = rgb(27292c)
}


#############
### INPUT ###
#############

input {
    kb_layout    = us
    follow_mouse = 1
    sensitivity  = 0
}


###################
### LAYER RULES ###
###################
# Camadas (barra e launcher) também recebem blur — é onde ele mais aparece.
layerrule {
    name = blur-bar
    match:namespace = ^(gtk4-layer-shell)$

    blur         = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-walker
    match:namespace = ^(walker)$

    blur         = true
    ignore_alpha = 0.3
}


####################
### WINDOW RULES ###
####################

# Diálogos flutuam e centralizam.
windowrule {
    name = float-dialogs
    match:class = ^(pwvucontrol|org.gnome.Calculator)$

    float  = yes
    center = yes
}


###################
### KEYBINDINGS ###
###################
# --- IMPORTADO LITERALMENTE de arch-settings/hypr/hyprland.conf ---
# Alterações: SUPER+R e SUPER+Return apontam para o Walker, SUPER+P para o
# power-menu movido para hypr/scripts, e SUPER+[0-9] usa dispatch direto
# (ws-smart.sh removido a pedido). Nenhuma tecla mudou.

$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
# Launcher único: apps, arquivos, Google e cálculo na mesma caixa.
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, C, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, B, exec, $browser
# Histórico de Ctrl+C: texto, caminhos e imagens (elephant-clipboard).
bind = $mainMod, V, exec, $menu --provider clipboard
bind = $mainMod, Y, exec, code
bind = $mainMod, P, exec, ~/.config/hypr/scripts/power-menu.sh
bind = $mainMod, O, exec, $terminal -e opencode
bind = $mainMod, D, exec, discord
bind = $mainMod, S, exec, spotify-launcher
bind = $mainMod, Escape, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, B, exec, chromium --enable-features=WebHID,WebUSB --app=https://qmk.top/
bind = $mainMod SHIFT, Escape, exec, $terminal -e btop

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = SUPER, Tab, workspace, +1
bind = SUPER SHIFT, Tab, workspace, -1

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, M, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
