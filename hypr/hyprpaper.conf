# Wallpaper monocromático: logo do Arch centralizado sobre #27292C.
# Composto em 1920x1080 a partir da imagem original de 596x335 — esticar
# o original direto deixaria as bordas do logo borradas.

preload = ~/.config/hypr/wallpapers/arch-wallpaper.png

wallpaper {
    monitor =
    path    = ~/.config/hypr/wallpapers/arch-wallpaper.png
}

splash = false
