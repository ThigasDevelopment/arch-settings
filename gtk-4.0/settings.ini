[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=SF Pro Text 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none

# gtk-application-prefer-dark-theme foi REMOVIDO de propósito: libadwaita
# não suporta essa chave e emite
#   Adwaita-WARNING: Using GtkSettings:gtk-application-prefer-dark-theme
#   with libadwaita is unsupported.
# Quem define o modo escuro é o gsettings color-scheme=prefer-dark, já no
# hyprland.conf.
