# Unifica o SELETOR DE ARQUIVOS de todo app — Qt, Electron, Firefox —
# no diálogo GTK, o mesmo do Nautilus.
#
# Isto é o que dá pra fazer de verdade sobre "todo mundo abrindo pelo GTK":
# não troca o toolkit do app, mas faz o diálogo de abrir/salvar ser
# sempre o mesmo, com o mesmo tema.
#
# Complementos por app:
#   Firefox  → about:config → widget.use-xdg-desktop-portal.file-picker = 1
#   Electron → --ozone-platform-hint=auto  (já no env do hyprland.lua)
#   Qt       → standard_dialogs=xdgdesktopportal (já nos qt5ct/qt6ct.conf)

[preferred]
default = hyprland;gtk
org.freedesktop.impl.portal.FileChooser = gtk
org.freedesktop.impl.portal.Settings = gtk
