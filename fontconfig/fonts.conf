<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Fonte de interface do sistema.
       SF Pro TEXT, não "SF Pro" genérica: a Apple desenha a variante Text
       para tamanhos de UI (abaixo de ~20pt) e a Display para títulos. A 11pt
       é a Text que tem o espacejamento e o corte certos. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Monoespaçada: JetBrains Mono Nerd, que carrega os glifos de ícone. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Fallback GLOBAL para os glifos Nerd Font.
       Este bloco é o que permite escrever `font-family: "SF Pro Text"` na
       barra e no Walker e mesmo assim ver os ícones: SF Pro não tem os
       codepoints da Private Use Area, então eles caem aqui.
       binding="weak" é obrigatório aqui: com "strong" a família anexada
       VENCE a que o app pediu, e todo sans-serif do sistema vira
       monoespaçado — foi o que aconteceu no primeiro teste. "weak" anexa
       ao FIM da cadeia, servindo só de fallback para glifos ausentes. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
